<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cannot find file — Baihaqi.exe</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 16px;
        background: linear-gradient(180deg, #2a78d2, #75b9ea 52%, #dff3ff);
        font: 13px/1.5 Tahoma, Verdana, sans-serif;
        color: #252525;
      }
      .win {
        width: min(420px, 100%);
        padding: 0 3px 3px;
        border-radius: 8px 8px 0 0;
        background: #1f5fd6;
        box-shadow: 0 14px 34px -6px rgba(0, 32, 90, 0.42);
      }
      .title {
        margin: 0 -3px;
        padding: 6px 8px;
        border-radius: 8px 8px 0 0;
        background: linear-gradient(180deg, #4a95f5, #1766d4 22%, #1561cf 55%, #2472e0 88%, #174d91);
        color: #fff;
        font: bold 13px 'Trebuchet MS', Tahoma, sans-serif;
        text-shadow: 1px 1px 1px #0b2f6e;
      }
      .body {
        display: flex;
        gap: 14px;
        padding: 18px 16px 8px;
        background: #ece9d8;
      }
      .body p {
        margin: 0 0 6px;
      }
      .foot {
        display: flex;
        justify-content: flex-end;
        padding: 8px 16px 16px;
        background: #ece9d8;
      }
      a.btn {
        min-width: 75px;
        padding: 3px 14px;
        border: 1px solid #003c74;
        border-radius: 3px;
        background: linear-gradient(180deg, #fff, #ecebe3 85%, #d6d0c5);
        color: #000;
        text-align: center;
        text-decoration: none;
      }
      code {
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="win" role="alertdialog" aria-labelledby="t" aria-describedby="d">
      <div class="title" id="t">Cannot find file</div>
      <div class="body" id="d">
        <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 3l14 25H2z" fill="#f0b020" stroke="#9a6b08" stroke-linejoin="round" />
          <rect x="14.5" y="11" width="3" height="9" rx="1" fill="#2b2b2b" />
          <circle cx="16" cy="23.5" r="1.7" fill="#2b2b2b" />
        </svg>
        <div>
          <p>This page could not be found. It may have been moved, renamed, or dragged into the Recycle Bin.</p>
          <p>Make sure the address is spelled correctly, then try again.</p>

      </div>
      <div class="foot"><a class="btn" href="/">OK</a></div>
    </div>
